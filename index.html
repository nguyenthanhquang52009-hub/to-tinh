<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tỏ tình ❤️</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-family:Arial;
    overflow:hidden;

    background-image:url("anh.jpg");
    background-size:cover;
    background-position:center;
}

h1{
    color:white;
    font-size:35px;
    text-shadow:3px 3px 10px black;
}

button{
    padding:15px 30px;
    font-size:18px;
    margin:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

#yes{
    background:#ff4d6d;
    color:white;
}

#no{
    background:#ddd;
}

/* trái tim */

.heart{
    position:fixed;
    color:red;
    font-size:20px;
    animation:fly 4s linear forwards;
}

@keyframes fly{
    0%{
        transform:translateY(0);
        opacity:1;
    }
    100%{
        transform:translateY(-800px);
        opacity:0;
    }
}

</style>
</head>

<body>

<h1>Làm người yêu anh nhé ❤️</h1>

<div id="buttons">
<button id="yes">Đồng ý</button>
<button id="no">Từ chối</button>
</div>

<script>

let count = 0
let noBtn = document.getElementById("no")
let yesBtn = document.getElementById("yes")
let container = document.getElementById("buttons")

// nút từ chối

noBtn.addEventListener("click",function(){

count++

if(count < 5){

let scale = 1 - count*0.15
noBtn.style.transform = "scale("+scale+")"

let x = Math.random()*window.innerWidth*0.8
let y = Math.random()*window.innerHeight*0.8

noBtn.style.position="absolute"
noBtn.style.left=x+"px"
noBtn.style.top=y+"px"

}else{

noBtn.style.display="none"

let newYes = document.createElement("button")
newYes.innerHTML="Đồng ý luôn ❤️"
newYes.style.background="#ff4d6d"
newYes.style.color="white"

container.appendChild(newYes)

}

})

// nút đồng ý

yesBtn.addEventListener("click",function(){

alert("Anh biết mà ❤️")

})

// trái tim bay

function createHeart(){

let heart = document.createElement("div")
heart.className="heart"
heart.innerHTML="❤️"

heart.style.left=Math.random()*100+"vw"
heart.style.bottom="0"

document.body.appendChild(heart)

setTimeout(()=>{
heart.remove()
},4000)

}

setInterval(createHeart,300)

</script>

</body>
</html>
