<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tỏ tình ❤️</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
font-family:sans-serif;
text-align:center;
color:white;
overflow:hidden;

/* Ảnh nền của bạn */
background-image:url("anh.jpg");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
}

h1{
font-size:40px;
text-shadow:0 0 20px pink;
}

button{
font-size:22px;
padding:12px 30px;
margin:15px;
border:none;
border-radius:30px;
cursor:pointer;
transition:0.3s;
}

#yes{
background:#ff4d6d;
color:white;
}

#no{
background:#555;
color:white;
position:absolute;
}

.heart{
position:fixed;
bottom:-20px;
font-size:22px;
animation:fly 5s linear;
}

@keyframes fly{

0%{
transform:translateY(0);
opacity:1;
}

100%{
transform:translateY(-100vh);
opacity:0;
}

}

</style>
</head>

<body>

<h1>Làm người yêu minh nhé ❤️</h1>

<audio id="music">
<source src="nhac.mp3" type="audio/mpeg">
</audio>

<div>

<button id="yes">Đồng ý 💖</button>
<button id="no">Từ chối 😢</button>

</div>

<script>

let yesBtn=document.getElementById("yes")
let noBtn=document.getElementById("no")
let music=document.getElementById("music")

// bấm đồng ý

yesBtn.onclick=function(){

music.play()

alert("Anh biết mà ❤️")

}

// nút từ chối chạy

noBtn.addEventListener("mouseover",function(){

let x=Math.random()*window.innerWidth
let y=Math.random()*window.innerHeight

noBtn.style.left=x+"px"
noBtn.style.top=y+"px"

})

// tim bay

function createHeart(){

let heart=document.createElement("div")

heart.className="heart"

heart.innerHTML="💖"

heart.style.left=Math.random()*100+"vw"

document.body.appendChild(heart)

setTimeout(()=>{
heart.remove()
},5000)

}

setInterval(createHeart,300)

</script>

</body>
</html>
