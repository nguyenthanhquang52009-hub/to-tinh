<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tỏ tình ❤️</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
font-family:sans-serif;
color:white;
text-align:center;
overflow:hidden;

background:url("background.jpg");
background-size:cover;
background-position:center;
}

h1{
font-size:45px;
text-shadow:0 0 20px pink;
}

button{
font-size:22px;
padding:12px 30px;
margin:20px;
border:none;
border-radius:30px;
cursor:pointer;
transition:0.3s;
}

#yes{
background:#ff4d6d;
color:white;
}

#no{
background:#666;
color:white;
position:absolute;
}

.heart{
position:fixed;
bottom:-20px;
font-size:20px;
animation:bay 5s linear infinite;
}

@keyframes bay{

0%{
transform:translateY(0);
opacity:1;
}

100%{
transform:translateY(-100vh);
opacity:0;
}

}

</style>
</head>

<body>

<h1>Làm người yêu anh nhé ❤️</h1>

<audio id="music">
<source src="nhac.mp3" type="audio/mpeg">
</audio>

<div>

<button id="yes">Đồng ý 💖</button>
<button id="no">Từ chối 😢</button>

</div>

<script>

let noBtn=document.getElementById("no")
let yesBtn=document.getElementById("yes")
let music=document.getElementById("music")

yesBtn.onclick=function(){

music.play()

alert("Anh biết mà ❤️")

}

noBtn.onmouseover=function(){

let x=Math.random()*window.innerWidth
let y=Math.random()*window.innerHeight

noBtn.style.left=x+"px"
noBtn.style.top=y+"px"

}

function taoTim(){

let heart=document.createElement("div")

heart.innerHTML="💖"

heart.className="heart"

heart.style.left=Math.random()*100+"vw"
heart.style.fontSize=(Math.random()*25+15)+"px"

document.body.appendChild(heart)

setTimeout(()=>{
heart.remove()
},5000)

}

setInterval(taoTim,300)

</script>

</body>
</html>
