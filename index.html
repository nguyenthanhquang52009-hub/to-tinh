<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tỏ tình ❤️</title>

<style>

body{
    text-align:center;
    font-family:Arial;
    margin:0;
    height:100vh;

    /* hình nền */
    background-image:url("anh.jpg");
    background-size:cover;
    background-position:center;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

h1{
    color:white;
    text-shadow:2px 2px 10px black;
}

button{
    padding:15px 30px;
    font-size:18px;
    margin:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

#yes{
    background:#ff4d6d;
    color:white;
}

#no{
    background:#ddd;
}

</style>
</head>

<body>

<h1>Làm người yêu anh nhé ❤️</h1>

<button id="yes">Đồng ý</button>
<button id="no">Từ chối</button>

<script>

let count = 0
let noBtn = document.getElementById("no")
let yesBtn = document.getElementById("yes")

noBtn.addEventListener("click",function(){

count++

if(count < 5){

let scale = 1 - count*0.15
noBtn.style.transform = "scale("+scale+")"

let x = Math.random()*window.innerWidth*0.8
let y = Math.random()*window.innerHeight*0.8

noBtn.style.position="absolute"
noBtn.style.left=x+"px"
noBtn.style.top=y+"px"

}else{

noBtn.style.display="none"

let newYes = document.createElement("button")
newYes.innerHTML="Đồng ý luôn ❤️"
newYes.style.background="#ff4d6d"
newYes.style.color="white"

document.body.appendChild(newYes)

}

})

yesBtn.addEventListener("click",function(){
alert("Anh biết mà ❤️")
})

</script>

</body>
</html>
